pluginManagement {
    repositories {
        gradlePluginPortal()
        // ForgeGradle 6 插件托管在 MinecraftForge maven, 不在 plugin portal
        maven { url = 'https://maven.minecraftforge.net/' }
        // parchment 映射注入插件 (与主 mod 同映射通道, 保证跨仓类/参数名一致)
        maven { url = 'https://maven.parchmentmc.org/' }
    }
    plugins {
        // 与主 mod 锁同一条线: FG 6.x + Gradle 8.1.1 + MC 1.20.1
        id 'net.minecraftforge.gradle' version '[6.0,6.2)'
        id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    }
}

rootProject.name = 'WokChestShop'
