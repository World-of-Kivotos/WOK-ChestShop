# Gradle / JVM
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# 与主 mod 同纪律: FG6 并行配置下 mapping 任务偶发竞态
org.gradle.parallel=false

# mod 坐标
mod_id=wokchestshop
mod_name=WOK ChestShop
mod_group=com.wokchestshop
mod_version=0.1.0
mod_license=AGPL-3.0-or-later
mod_authors=ShinoyukiMiyako

# 平台版本: 必须与主 mod (miningdim) 逐字一致, 否则跨 mod 调用在运行期对不上
mc_version=1.20.1
forge_version=47.3.0
forge_full_version=1.20.1-47.3.0
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# 主 mod 依赖坐标 (经 flatDir 解析到 libs/miningdim-1.20.1-1.0.0.jar; 见 build.gradle 对 fg.deobf 的说明)
# 换主 mod 版本时同步改这里与 libs/ 下的 jar 文件名
miningdim_group=com.miningdim
miningdim_artifact=miningdim-1.20.1
miningdim_version=1.0.0
